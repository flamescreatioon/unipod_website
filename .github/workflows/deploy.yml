name: Deploy to FTP Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Project
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET || 'production' }}
          VITE_SANITY_STUDIO_URL: ${{ secrets.VITE_SANITY_STUDIO_URL }}
        run: npm run build

      - name: 🔍 Validate & Prepare FTP Config
        id: ftp-prep
        env:
          FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTO_RAW: ${{ secrets.FTP_PROTOCOL }}
        run: |
          if [ -z "$FTP_SERVER_RAW" ]; then
            echo "::error::Secret FTP_SERVER is missing or empty! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$FTP_USER" ]; then
            echo "::error::Secret FTP_USERNAME is missing or empty! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$FTP_PASS" ]; then
            echo "::error::Secret FTP_PASSWORD is missing or empty! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip protocol (ftp://, ftps://, etc.) and any trailing paths/slashes or whitespace
          CLEAN_SERVER=$(echo "$FTP_SERVER_RAW" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|/.*$||' | tr -d '[:space:]')
          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"

          # Determine protocol: if unset or 'ftp', upgrade to 'ftps' since server requires TLS
          CLEAN_PROTO=$(echo "$FTP_PROTO_RAW" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$CLEAN_PROTO" ] || [ "$CLEAN_PROTO" = "ftp" ]; then
            CLEAN_PROTO="ftps"
          fi
          echo "protocol=$CLEAN_PROTO" >> "$GITHUB_OUTPUT"
          echo "Configured protocol: $CLEAN_PROTO on host: $CLEAN_SERVER"

      - name: 🚀 Sync to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp-prep.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ steps.ftp-prep.outputs.protocol }}
          security: loose
          log-level: verbose
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./dist/
